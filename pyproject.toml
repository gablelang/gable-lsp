[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gable-lsp"
version = "0.1.0"
description = "Language Server Protocol (LSP) implementation for the Gable programming language"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Gable Language Contributors" }]
requires-python = ">=3.9"
keywords = ["gable", "lsp", "language-server", "editor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
]
dependencies = []

[project.scripts]
gable-lsp = "gable_lsp.main:entrypoint"

[project.urls]
Homepage = "https://github.com/gablelang/gable-lsp"
Compiler = "https://github.com/gablelang/gable"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gable_lsp = ["py.typed"]
